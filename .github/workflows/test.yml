name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Los tests necesitan un .env: el servidor MCP aborta sin CLIENT_ID y el
      # bot sale al importarse sin TELEGRAM_*. Poner esas variables en `env:`
      # del job NO basta: el test lanza el servidor con StdioClientTransport sin
      # `env`, y el SDK solo hereda una lista blanca (PATH, HOME…). Valores
      # ficticios: ningún test llama a Microsoft ni a Telegram.
      - name: Create CI .env (dummy values)
        run: |
          sed 's/your-client-id-here/ci-dummy-client-id/' .env.example > .env
          echo "TELEGRAM_BOT_TOKEN=000000:ci-dummy-token" >> .env
          echo "TELEGRAM_ALLOWED_USER_ID=1" >> .env

      - name: Build TypeScript
        run: npm run build

      - name: Node.js tests
        run: node --test test/*.test.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Python tests
        run: python -m pytest test/test_bot.py -q